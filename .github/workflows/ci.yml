name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gowild
          POSTGRES_PASSWORD: gowild
          POSTGRES_DB: gowild
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps

      - name: Ruff format check
        working-directory: apps/api
        run: ruff format --check

      - name: Ruff lint
        working-directory: apps/api
        run: ruff check

      - name: Type check with mypy
        working-directory: apps/api
        run: mypy app

      - name: pytest
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
          REDIS_URL: redis://localhost:6379/0
          CACHE_ENABLED: "false"
          RATE_LIMIT_ENABLED: "false"
        run: pytest tests/ -v

      - name: Operations regression tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
          REDIS_URL: redis://localhost:6379/0
        run: >-
          pytest tests/test_api_caching.py tests/test_cache_and_rate_limit.py
          tests/test_operations_api.py tests/test_observability.py -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API types
        working-directory: apps/web
        run: pnpm check:types

      - name: Unit and component tests
        working-directory: apps/web
        run: pnpm test

      - name: Type check
        working-directory: apps/web
        run: pnpm type-check

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end and accessibility tests
        working-directory: apps/web
        run: pnpm test:e2e

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Python dependency and static analysis
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.lock
          pip install -e . --no-deps
          pip install pip-audit bandit
          pip-audit -r requirements.lock --no-deps --disable-pip
          bandit -q -r app

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node dependency audit
        run: pnpm audit --audit-level high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@v3.90.8
        with:
          extra_args: --results=verified,unknown

  staging:
    runs-on: ubuntu-latest
    needs: [backend, frontend, security]
    env:
      COMPOSE_FILE: infrastructure/docker-compose.yml
      COMPOSE_PROJECT_NAME: phase5-staging
      APP_ENV: staging
      APP_RELEASE: ci-${{ github.sha }}
      METRICS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install locked browser dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and build deployment artifacts
        run: |
          docker compose config --quiet
          docker compose build api web

      - name: Migrate and seed synthetic staging data
        run: |
          docker compose up -d --wait postgres redis
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api python -m app.cli airport-seed data/fixtures/sample_airports.csv
          docker compose run --rm api python -m app.cli schedule-import data/fixtures/sample_schedule.csv

      - name: Start real staging stack
        run: docker compose up -d --wait api web

      - name: Health and lightweight load smoke
        run: |
          curl --fail-with-body http://localhost:8000/api/v1/health/live
          curl --fail-with-body http://localhost:8000/api/v1/health/ready
          cd apps/api
          python -m pip install -r requirements-dev.lock
          python -m pip install -e . --no-deps
          locust -f locustfile.py --headless -u 2 -r 2 -t 10s --host http://localhost:8000 --only-summary
          docker compose -f ../../infrastructure/docker-compose.yml exec -T redis redis-cli FLUSHDB

      - name: Install Playwright Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Full-stack browser acceptance
        working-directory: apps/web
        env:
          FULL_STACK_API_URL: http://localhost:8000
          FULL_STACK_BASE_URL: http://localhost:3000
        run: pnpm test:e2e:fullstack

      - name: Prove Redis outage and recovery
        run: |
          docker compose exec -T redis redis-cli FLUSHDB
          docker compose stop redis
          curl --fail-with-body -H 'Content-Type: application/json' -d '{"origin":"ATL","departure_date":"2026-08-04","max_connections":0}' http://localhost:8000/api/v1/search
          curl --fail-with-body http://localhost:8000/api/v1/health/ready
          docker compose start redis
          sleep 31
          curl --fail-with-body -H 'Content-Type: application/json' -d '{"origin":"ATL","departure_date":"2026-08-05","max_connections":0}' http://localhost:8000/api/v1/search
          curl --fail-with-body -H 'Content-Type: application/json' -d '{"origin":"ATL","departure_date":"2026-08-05","max_connections":0}' http://localhost:8000/api/v1/search
          curl --fail-with-body http://localhost:8000/api/v1/health/ready

      - name: Scan API container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: phase5-staging-api:latest
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Scan web container
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: phase5-staging-web:latest
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Preserve staging failure artifacts
        if: always()
        run: |
          mkdir -p artifacts
          docker compose logs --no-color > artifacts/compose.log

      - name: Upload staging artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-5-staging-${{ github.run_id }}
          path: |
            artifacts/
            apps/web/playwright-report/
            apps/web/test-results/
