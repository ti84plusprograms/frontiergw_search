name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gowild
          POSTGRES_PASSWORD: gowild
          POSTGRES_DB: gowild
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10.6"

      - name: Install dependencies
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        working-directory: apps/api
        run: ruff format --check

      - name: Ruff lint
        working-directory: apps/api
        run: ruff check

      - name: Type check with mypy
        working-directory: apps/api
        run: mypy app

      - name: Validate database migrations
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
        run: |
          alembic upgrade head
          alembic current

      - name: pytest
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Type check
        working-directory: apps/web
        run: pnpm type-check

      - name: Lint
        working-directory: apps/web
        run: pnpm lint

      - name: Build
        working-directory: apps/web
        run: pnpm build
