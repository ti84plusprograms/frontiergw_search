name: Release gates

on:
  workflow_dispatch:
    inputs:
      promote_to_production:
        description: "Run the production approval gate after staging validation"
        required: true
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gowild
          POSTGRES_PASSWORD: gowild
          POSTGRES_DB: gowild
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.6"
      - name: Install backend
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Migration dry run
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
        run: alembic upgrade head --sql
      - name: OpenAPI contract check
        env:
          DATABASE_URL: postgresql+psycopg://gowild:gowild@localhost:5432/gowild
          REDIS_URL: redis://localhost:6379/0
        run: python scripts/check_openapi.py

  staging:
    needs: validate
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Staging deployment gate
        run: |
          echo "Staging environment approval granted. Configure the provider deployment command for this environment."
          test -n "${{ vars.DEPLOY_COMMAND }}"
          eval "${{ vars.DEPLOY_COMMAND }}"

  production:
    if: ${{ inputs.promote_to_production }}
    needs: staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Production deployment gate
        run: |
          echo "Production approval granted. Running the configured deployment command."
          test -n "${{ vars.DEPLOY_COMMAND }}"
          eval "${{ vars.DEPLOY_COMMAND }}"
