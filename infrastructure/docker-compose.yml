services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gowild
      POSTGRES_PASSWORD: gowild
      POSTGRES_DB: gowild
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gowild"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_RELEASE: ${APP_RELEASE:-local-compose}
      DATABASE_URL: postgresql+psycopg://gowild:gowild@postgres:5432/gowild
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: INFO
      LOG_FORMAT: ${LOG_FORMAT:-json}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      AIRPORT_RATE_LIMIT_PER_MINUTE: ${AIRPORT_RATE_LIMIT_PER_MINUTE:-120}
      SEARCH_RATE_LIMIT_PER_MINUTE: ${SEARCH_RATE_LIMIT_PER_MINUTE:-30}
      SCHEDULE_STATUS_RATE_LIMIT_PER_MINUTE: ${SCHEDULE_STATUS_RATE_LIMIT_PER_MINUTE:-60}
      TRUSTED_PROXY_NETWORKS: ${TRUSTED_PROXY_NETWORKS:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    volumes:
      - ../apps/api:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
        NEXT_PUBLIC_APP_RELEASE: ${APP_RELEASE:-local-compose}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_RELEASE: ${APP_RELEASE:-local-compose}
      SENTRY_DSN: ${SENTRY_DSN:-}
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_ENV: ${APP_ENV:-development}
      NEXT_PUBLIC_APP_RELEASE: ${APP_RELEASE:-local-compose}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 18

volumes:
  postgres_data:
  redis_data:
